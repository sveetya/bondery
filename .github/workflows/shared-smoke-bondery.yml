name: Shared - Bondery release smoke

on:
  workflow_call:
    inputs:
      service:
        description: Service to smoke (webapp or api)
        required: true
        type: string
      image_name:
        description: GHCR image name (without tag)
        required: true
        type: string
      image_tag:
        description: Semver image tag to pull and test
        required: true
        type: string
      checkout_ref:
        description: Git ref for compose/scripts at release commit
        required: true
        type: string
    secrets:
      BONDERY_OPS_GHCR_WRITE_TOKEN:
        required: true

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: v5.3.1

      - name: Ensure Compose plugin supports pre_start (2.38+)
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL "https://github.com/docker/compose/releases/download/v5.3.1/docker-compose-linux-$(uname -m)" \
            -o ~/.docker/cli-plugins/docker-compose
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version

      - name: Ensure dokploy-network exists
        run: docker network create dokploy-network || true

      - name: Log in to GHCR
        uses: ./.github/actions/shared/ghcr-login
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.BONDERY_OPS_GHCR_WRITE_TOKEN }}

      - name: Run release smoke
        run: |
          node deploy/bondery/scripts/smoke-release.mjs \
            --service "${{ inputs.service }}" \
            --tag "${{ inputs.image_tag }}" \
            --image "${{ inputs.image_name }}"

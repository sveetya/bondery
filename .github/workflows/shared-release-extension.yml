name: Shared - Release extension



on:

  workflow_call:

    inputs:

      version:

        description: Extension semver (X.Y.Z)

        required: true

        type: string

      extension_tag:

        description: Optional legacy ext-X.Y.Z prefix for asset filenames

        required: false

        type: string

        default: ""

    outputs:

      zip_path:

        description: Path to extension zip artifact

        value: ${{ jobs.build.outputs.zip_path }}

      crx_path:

        description: Path to extension crx artifact

        value: ${{ jobs.build.outputs.crx_path }}

      public_key_path:

        description: Path to public key pem artifact

        value: ${{ jobs.build.outputs.public_key_path }}



permissions:

  contents: read

  id-token: write



jobs:

  build:

    runs-on: ubuntu-latest

    outputs:

      zip_path: ${{ steps.paths.outputs.zip_path }}

      crx_path: ${{ steps.paths.outputs.crx_path }}

      public_key_path: ${{ steps.paths.outputs.public_key_path }}

    env:

      TURBO_TELEMETRY_DISABLED: 1

      PRIVATE_CHROME_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.PRIVATE_CHROME_SERVICE_ACCOUNT_KEY_JSON }}

      PRIVATE_CHROME_PRIVATE_SIGNING_KEY: ${{ secrets.PRIVATE_CHROME_PRIVATE_SIGNING_KEY }}

      TURBO_TEAM: ${{ vars.BONDERY_OPS_TURBO_TEAM }}

      TURBO_TOKEN: ${{ secrets.BONDERY_OPS_TURBO_TOKEN }}



    steps:

      - uses: actions/checkout@v7

        with:

          persist-credentials: false



      - uses: ./.github/actions/shared/infisical-production-secrets



      - uses: ./.github/actions/shared/derive-public-urls



      - uses: ./.github/actions/shared/resolve-ci-env-fallback

        with:

          profile: extension



      - name: Verify extension CI env

        run: node scripts/check-ci-infisical.mjs extension



      - uses: ./.github/actions/shared/setup-pnpm



      - name: Resolve asset paths

        id: paths

        env:

          ASSET_SUFFIX: ${{ inputs.extension_tag != '' && inputs.extension_tag || inputs.version }}

        run: |

          echo "zip_path=bondery-extension-${ASSET_SUFFIX}.zip" >> "$GITHUB_OUTPUT"

          echo "crx_path=apps/chrome-extension/bondery-extension-${ASSET_SUFFIX}.crx" >> "$GITHUB_OUTPUT"

          echo "public_key_path=bondery-extension-${ASSET_SUFFIX}.public-key.pem" >> "$GITHUB_OUTPUT"



      - name: Create production environment file

        run: |

          echo "BONDERY_PUBLIC_WEBAPP_URL=$BONDERY_PUBLIC_WEBAPP_URL" > apps/chrome-extension/.env.production.local

          echo "BONDERY_PUBLIC_API_URL=$BONDERY_PUBLIC_API_URL" >> apps/chrome-extension/.env.production.local

          echo "BONDERY_PUBLIC_OAUTH_CLIENT_ID=$BONDERY_PUBLIC_OAUTH_CLIENT_ID" >> apps/chrome-extension/.env.production.local



      - name: Build Chrome Extension

        env:

          NODE_ENV: production

        run: pnpm exec turbo build --filter=chrome-extension...



      - name: Create signed CRX and zip

        env:

          ASSET_SUFFIX: ${{ inputs.extension_tag != '' && inputs.extension_tag || inputs.version }}

        run: |

          PRIVATE_KEY_PATH="apps/chrome-extension/private-key.pem"

          PUBLIC_KEY_PATH="apps/chrome-extension/public-key.pem"

          CRX_PATH="apps/chrome-extension/bondery-extension-${ASSET_SUFFIX}.crx"

          PUBLIC_KEY_ASSET_PATH="./bondery-extension-${ASSET_SUFFIX}.public-key.pem"



          printf "%b" "$PRIVATE_CHROME_PRIVATE_SIGNING_KEY" > "$PRIVATE_KEY_PATH"

          openssl pkey -in "$PRIVATE_KEY_PATH" -pubout -out "$PUBLIC_KEY_PATH"



          pnx crx3@2 \

            -p "$PRIVATE_KEY_PATH" \

            -o "$CRX_PATH" \

            apps/chrome-extension/dist/chrome-mv3



          cp "$PUBLIC_KEY_PATH" "$PUBLIC_KEY_ASSET_PATH"



          node -e "const fs=require('fs'); const crx=fs.readFileSync(process.argv[1]); if(crx.subarray(0,4).toString()!=='Cr24'){ console.error('Invalid CRX header'); process.exit(1);} " "$CRX_PATH"



          rm -f "$PRIVATE_KEY_PATH" "$PUBLIC_KEY_PATH"



          cd apps/chrome-extension/dist/chrome-mv3

          zip -r "../../../../bondery-extension-${ASSET_SUFFIX}.zip" .

          cd ../../..



      - name: Authenticate to Google Cloud

        id: gcp_auth

        uses: google-github-actions/auth@v3

        with:

          credentials_json: ${{ secrets.PRIVATE_CHROME_SERVICE_ACCOUNT_KEY_JSON }}

          token_format: access_token

          access_token_scopes: https://www.googleapis.com/auth/chromewebstore



      - name: Fetch Chrome Web Store item status

        run: |

          STATUS_RESPONSE=$(curl -sS -X GET \

            "https://chromewebstore.googleapis.com/v2/publishers/$BONDERY_OPS_CHROME_PUBLISHER_ID/items/$BONDERY_INFRA_CHROME_EXTENSION_ID:fetchStatus" \

            -H "Authorization: Bearer ${{ steps.gcp_auth.outputs.access_token }}")



          echo "$STATUS_RESPONSE" | node -e "const fs=require('fs'); const input=fs.readFileSync(0,'utf8'); const data=JSON.parse(input); if(data.error){ console.error('❌ fetchStatus failed'); console.error(input); process.exit(1);} const itemState = data.itemState || 'UNKNOWN'; const uploadState = data.uploadState || 'UNKNOWN'; console.log(\`✅ fetchStatus OK | itemState=\${itemState} uploadState=\${uploadState}\`);"



      - name: Upload CRX to Chrome Web Store

        env:

          ASSET_SUFFIX: ${{ inputs.extension_tag != '' && inputs.extension_tag || inputs.version }}

        run: |

          CRX_PATH="./apps/chrome-extension/bondery-extension-${ASSET_SUFFIX}.crx"

          CRX_FILE_NAME="bondery-extension-${{ inputs.version }}.crx"



          HTTP_CODE=$(curl -sS -o /tmp/cws-upload-response.json -w "%{http_code}" -X POST \

            "https://chromewebstore.googleapis.com/upload/v2/publishers/$BONDERY_OPS_CHROME_PUBLISHER_ID/items/$BONDERY_INFRA_CHROME_EXTENSION_ID:upload" \

            -H "Authorization: Bearer ${{ steps.gcp_auth.outputs.access_token }}" \

            -H "X-Goog-Upload-Protocol: raw" \

            -H "X-Goog-Upload-File-Name: $CRX_FILE_NAME" \

            -H "Content-Type: application/x-chrome-extension" \

            --data-binary @"$CRX_PATH")



          node -e "const fs=require('fs'); const code=Number(process.argv[1]); const input=fs.readFileSync('/tmp/cws-upload-response.json','utf8'); if(code < 200 || code >= 300){ console.error('Upload request failed'); console.error(input); process.exit(1);} try { const data=JSON.parse(input); console.log('Upload summary:', JSON.stringify({uploadState:data.uploadState, crxVersion:data.crxVersion}, null, 2)); } catch { console.log('Upload response was not JSON'); }" "$HTTP_CODE"



      - name: Publish Chrome Web Store item

        run: |

          PUBLISH_RESPONSE=$(curl -sS -X POST \

            "https://chromewebstore.googleapis.com/v2/publishers/$BONDERY_OPS_CHROME_PUBLISHER_ID/items/$BONDERY_INFRA_CHROME_EXTENSION_ID:publish" \

            -H "Authorization: Bearer ${{ steps.gcp_auth.outputs.access_token }}")



          echo "$PUBLISH_RESPONSE" | node -e "const fs=require('fs'); const input=fs.readFileSync(0,'utf8'); const data=JSON.parse(input); const state=String(data.state||'').toUpperCase(); const status=data.status; const okStatus = Array.isArray(status) ? status.map(String).map(s=>s.toUpperCase()).includes('OK') : String(status||'').toUpperCase()==='OK'; const okState = ['PENDING_REVIEW','PUBLISHED'].includes(state); if(!(okStatus || okState)){ console.error(input); process.exit(1);} console.log('✅ publish accepted | state=' + (state || 'UNKNOWN'));"



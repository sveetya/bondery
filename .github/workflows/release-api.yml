name: Release - API

on:
  push:
    tags:
      - "api-*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (format: api-X.Y.Z)"
        required: true
        type: string
      force_rebuild:
        description: "Rebuild image from source instead of promoting :sha from main"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  validate:
    uses: ./.github/workflows/shared-release-validate.yml
    with:
      tag_prefix: api
      manual_release_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}

  resolve_sha:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short }}
    steps:
      - name: Resolve short SHA
        id: sha
        run: echo "short=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

  promote:
    needs: [validate, resolve_sha]
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.force_rebuild }}
    uses: ./.github/workflows/shared-promote-image-tag.yml
    secrets: inherit
    with:
      image_name: ghcr.io/usebondery/api
      source_tag: sha-${{ needs.resolve_sha.outputs.short_sha }}
      target_tag: ${{ needs.validate.outputs.version }}

  build-push:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild }}
    uses: ./.github/workflows/shared-docker-build-push.yml
    secrets: inherit
    with:
      checkout_ref: ${{ needs.validate.outputs.tag }}
      dockerfile: apps/api/Dockerfile
      dockerignore_file: .dockerignore.api
      image_name: ghcr.io/usebondery/api
      docker_tags: |
        type=raw,value=${{ needs.validate.outputs.version }}
        type=sha,prefix=sha-,format=short
      oci_title: Bondery API
      oci_description: Bondery production API server
      oci_documentation: https://github.com/usebondery/bondery/blob/main/docs/deploy/api-container.md
      oci_version: ${{ needs.validate.outputs.version }}
      git_sha: ${{ github.sha }}
      build_args: |
        BONDERY_INFRA_GIT_SHA=${{ github.sha }}
        VERSION=${{ needs.validate.outputs.version }}

  image_ready:
    needs: [validate, promote, build-push]
    if: ${{ always() && (needs.promote.result == 'success' || needs.build-push.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "API image ready at version ${{ needs.validate.outputs.version }}"

  smoke:
    needs: [validate, image_ready, promote, build-push]
    if: ${{ always() && needs.image_ready.result == 'success' }}
    uses: ./.github/workflows/shared-smoke-bondery.yml
    secrets: inherit
    with:
      checkout_ref: ${{ needs.validate.outputs.tag }}
      image_name: ghcr.io/usebondery/api
      image_tag: ${{ needs.validate.outputs.version }}
      service: api

  promote-production:
    needs: [validate, smoke]
    uses: ./.github/workflows/shared-promote-production.yml
    secrets: inherit
    with:
      image_name: ghcr.io/usebondery/api
      version: ${{ needs.validate.outputs.version }}

  github-release:
    needs: [validate, image_ready]
    uses: ./.github/workflows/shared-container-github-release.yml
    with:
      tag: ${{ needs.validate.outputs.tag }}
      version: ${{ needs.validate.outputs.version }}
      image_name: ghcr.io/usebondery/api
      product_name: Bondery API

  notify-dokploy:
    needs: [image_ready, smoke, promote-production]
    if: ${{ always() && needs.smoke.result == 'success' && needs.promote-production.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/shared/dokploy-deploy-webhook
        with:
          webhook_url: ${{ vars.BONDERY_OPS_DOKPLOY_SERVICES_DEPLOY_WEBHOOK }}
          branch: release

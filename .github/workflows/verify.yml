name: Verify

on:
  pull_request:
  push:
    branches:
      - main

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: biomejs/setup-biome@v2
        with:
          version: 2.5.0

      - name: Biome
        run: biome ci .

      - name: Check dev ports
        run: npm run check-dev-ports

      - name: Check package imports
        run: npm run check-package-imports

      - name: Check env sync (examples + turbo)
        run: npm run env -- --check

      - name: Validate doc links
        run: npm run check-doc-links

      - name: Check OpenAPI spec
        run: npm run check-openapi

      - name: Validate Bondery deploy compose
        run: |
          cp deploy/bondery/.env.example deploy/bondery/.env
          docker compose -f deploy/bondery/docker-compose.yml config >/dev/null
          node deploy/bondery/scripts/check-compose.mjs

      - name: Validate Bondery compose includes Supabase fragment
        run: |
          docker compose -f deploy/bondery/docker-compose.yml config --services \
            | grep -E '^(kong|db|auth|rest|api|webapp|redis)$'

      - name: Webapp runtime config tests
        run: npm run test:runtime-config -w webapp

      - name: Schema contract tests
        run: npm run test:contracts

      - name: Typecheck
        run: npm run check-types

      - name: Build API bootstrap CLIs
        env:
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:54322/bondery
        run: |
          npx turbo build --filter=@bondery/db --filter=api
          test -f apps/api/dist/cli/release-migrate.js
          test -f apps/api/dist/cli/ensure-storage-buckets.js

      - name: Translation checks
        run: |
          npm run check-translations
          npm run check-api-error-translations
          npm run i18n:types:check
          npm run i18n:status:check
          node packages/translations/scripts/verify-i18next-hook-extraction.mjs
          npm run i18n:lint

      - name: API error checks
        run: |
          npm run check-error-docs
          npm run check-user-facing-errors

      - name: API sync unit tests
        run: npm run test:sync -w apps/api

      - name: API smoke tests
        run: npm run test:api -w apps/api

  auth:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: bondery
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BONDERY_INFRA_CHROME_EXTENSION_ID: abcdefghijklmnopqrstuvwxyzabcdef
      BONDERY_PRIVATE_BETTER_AUTH_SECRETS: 1:dummy-better-auth-secret-for-integration-tests-32
      BONDERY_PRIVATE_REDIS_URL: redis://127.0.0.1:6379
      BONDERY_PRIVATE_WEBAPP_OAUTH_CLIENT_SECRET: test-webapp-oauth-client-secret-32chars-min
      BONDERY_PUBLIC_API_URL: http://localhost:26631
      BONDERY_PUBLIC_OAUTH_CLIENT_ID: test-extension-oauth-client
      BONDERY_PUBLIC_WEBAPP_OAUTH_CLIENT_ID: test-webapp-oauth-client
      BONDERY_PUBLIC_WEBAPP_URL: http://localhost:26632
      DATABASE_URL: postgresql://postgres:password@127.0.0.1:54322/bondery
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build db package for release-migrate hooks
        run: npx turbo build --filter=@bondery/db

      - name: Release migrate
        run: npm run release-migrate -w @bondery/db

      - name: Auth integration tests
        run: npm run test:auth -w apps/api

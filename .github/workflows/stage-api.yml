name: Stage - API

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/**"
      - "scripts/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - ".dockerignore.api"
      - ".github/actions/shared/**"
      - ".github/workflows/stage-api.yml"
      - ".github/workflows/shared-docker-build-push.yml"

permissions:
  contents: read
  packages: write

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: bondery
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BONDERY_INFRA_CHROME_EXTENSION_ID: abcdefghijklmnopqrstuvwxyzabcdef
      BONDERY_PRIVATE_BETTER_AUTH_SECRETS: 1:dummy-better-auth-secret-for-integration-tests-32
      BONDERY_PRIVATE_REDIS_URL: redis://127.0.0.1:6379
      BONDERY_PRIVATE_WEBAPP_OAUTH_CLIENT_SECRET: test-webapp-oauth-client-secret-32chars-min
      BONDERY_PUBLIC_API_URL: http://localhost:26631
      BONDERY_PUBLIC_OAUTH_CLIENT_ID: test-extension-oauth-client
      BONDERY_PUBLIC_WEBAPP_OAUTH_CLIENT_ID: test-webapp-oauth-client
      BONDERY_PUBLIC_WEBAPP_URL: http://localhost:26632
      DATABASE_URL: postgresql://postgres:password@127.0.0.1:54322/bondery
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build db package for release-migrate
        run: npx turbo build --filter=@bondery/db

      - name: Release migrate
        run: npm run release-migrate -w @bondery/db

      - name: API sync unit tests
        run: npm run test:sync -w api

      - name: API smoke tests
        run: npm run test:api -w api

  build-push:
    needs: gate
    uses: ./.github/workflows/shared-docker-build-push.yml
    secrets: inherit
    with:
      dockerfile: apps/api/Dockerfile
      dockerignore_file: .dockerignore.api
      image_name: ghcr.io/usebondery/api
      docker_tags: |
        type=raw,value=beta
        type=sha,prefix=sha-,format=short
      oci_title: Bondery API
      oci_description: Bondery API server (integration builds from main)
      oci_documentation: https://github.com/usebondery/bondery/blob/main/docs/deploy/api-container.md
      oci_version: beta
      git_sha: ${{ github.sha }}
      build_args: |
        BONDERY_INFRA_GIT_SHA=${{ github.sha }}

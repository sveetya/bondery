name: Sync Dokploy env

# Manual Infisical production → Dokploy ops compose env sync (domain keys only).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log upload keys without calling Dokploy API
        type: boolean
        default: true
      redeploy:
        description: Trigger ops deploy webhook after save
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  sync-ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build helpers (env manifest exports)
        run: pnpm --filter @bondery/helpers run build

      - uses: ./.github/actions/shared/infisical-fetch-secrets
        with:
          env-slug: production

      - uses: ./.github/actions/shared/dokploy-save-compose-env
        with:
          dry_run: ${{ inputs.dry_run }}
          redeploy: ${{ inputs.redeploy }}
          target: ops

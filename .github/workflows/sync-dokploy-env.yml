name: Sync Dokploy env

# Manual Infisical -> Dokploy compose env sync (website, services, or plausible stack).
# Beta fetches staging app secrets + production ops keys; website and services both supported.

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: "Infisical source for app secrets (ops keys always from production)"
        type: choice
        options:
          - production
          - beta
        default: production
      target:
        description: "Dokploy compose stack to sync"
        type: choice
        options:
          - website
          - services
          - plausible
        default: website
      dry_run:
        description: "Dry run: log env names instead of uploading to Dokploy"
        type: boolean
        default: true
      redeploy:
        description: "Trigger redeploy webhook"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  sync-ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/shared/setup-pnpm

      - name: Build helpers (env manifest exports)
        run: pnpm --filter @bondery/helpers run build

      - name: Validate deployment and target
        run: |
          if [ "${{ inputs.deployment }}" = "beta" ] && [ "${{ inputs.target }}" = "plausible" ]; then
            echo "sync-dokploy-env: deployment=beta does not support target=plausible (no beta Plausible)"
            exit 1
          fi

      - uses: ./.github/actions/shared/infisical-fetch-secrets
        with:
          env-slug: production

      - name: Snapshot production Dokploy ops keys
        if: inputs.deployment == 'beta'
        run: env | grep '^BONDERY_OPS_DOKPLOY_' > "$RUNNER_TEMP/dokploy-ops.env"

      - uses: ./.github/actions/shared/infisical-fetch-secrets
        if: inputs.deployment == 'beta'
        with:
          env-slug: staging

      - name: Restore production Dokploy ops keys after staging fetch
        if: inputs.deployment == 'beta'
        run: |
          while IFS= read -r line; do
            echo "$line" >> "$GITHUB_ENV"
          done < "$RUNNER_TEMP/dokploy-ops.env"

      - name: Resolve Dokploy sync target
        id: sync-target
        run: |
          if [ "${{ inputs.deployment }}" = "beta" ] && [ "${{ inputs.target }}" = "website" ]; then
            echo "target=website-beta" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.deployment }}" = "beta" ] && [ "${{ inputs.target }}" = "services" ]; then
            echo "target=services-beta" >> "$GITHUB_OUTPUT"
          else
            echo "target=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/shared/dokploy-save-compose-env
        with:
          dry_run: ${{ inputs.dry_run }}
          redeploy: ${{ inputs.redeploy }}
          target: ${{ steps.sync-target.outputs.target }}

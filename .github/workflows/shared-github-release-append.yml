name: Shared - GitHub release append

on:
  workflow_call:
    inputs:
      tag:
        description: Git release tag (e.g. v1.8.3)
        required: true
        type: string
      section:
        description: Markdown section to append to the release body
        required: true
        type: string

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - name: Append release section
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          append_body: true
          body: ${{ inputs.section }}

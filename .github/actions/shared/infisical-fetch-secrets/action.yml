name: Infisical fetch secrets
description: Fetch Infisical secrets via OIDC for CI workflows.

inputs:
  env-slug:
    description: Infisical environment slug (development, staging, or production)
    required: true

runs:
  using: composite
  steps:
    - name: Fetch secrets from Infisical
      uses: Infisical/secrets-action@v1.0.16
      with:
        method: oidc
        identity-id: f8b9e69d-bc32-4066-ad99-8ad6ecff2d21
        project-slug: bondery-secrets
        env-slug: ${{ inputs.env-slug }}
        domain: https://eu.infisical.com

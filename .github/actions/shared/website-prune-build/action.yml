name: Website pruned production build
description: >-
  Prune the monorepo for website (turbo prune --docker), install pruned deps,
  and run turbo build --filter=website. Matches apps/website/Dockerfile build env.
  Caller must checkout the repo and configure Node + Turbo remote cache first.

runs:
  using: composite
  steps:
    - name: Prune monorepo for website
      shell: bash
      run: npx turbo prune website --docker

    - name: Install pruned dependencies
      shell: bash
      run: |
        cp -r out/full/* out/json/
        cp -r docs out/json/docs
        cp -r scripts out/json/scripts
        mkdir -p out/json/apps/api
        cp apps/api/openapi.yaml out/json/apps/api/openapi.yaml
        cd out/json
        npm ci --ignore-scripts

    - name: Build website
      shell: bash
      working-directory: out/json
      env:
        BONDERY_PUBLIC_WEBAPP_URL: https://app.example.com
        BONDERY_PUBLIC_WEBSITE_URL: https://example.com
      run: npx turbo build --filter=website

name: Resolve CI env with GitHub fallback
description: >-
  Fill missing Infisical-loaded env vars from GitHub repository variables
  during the Infisical migration cutover.

inputs:
  profile:
    description: extension | services-webhook | website-webhook
    required: true

runs:
  using: composite
  steps:
    - name: Apply GitHub variable fallbacks
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        GH_CHROME_EXTENSION_ID: ${{ vars.BONDERY_OPS_CHROME_EXTENSION_ID }}
        GH_CHROME_PUBLISHER_ID: ${{ vars.BONDERY_OPS_CHROME_PUBLISHER_ID }}
        GH_PUBLIC_WEBAPP_URL: ${{ vars.BONDERY_PUBLIC_WEBAPP_URL }}
        GH_PUBLIC_API_URL: ${{ vars.BONDERY_PUBLIC_API_URL }}
        GH_PUBLIC_OAUTH_CLIENT_ID: ${{ vars.BONDERY_PUBLIC_OAUTH_CLIENT_ID }}
        GH_SERVICES_WEBHOOK: ${{ vars.BONDERY_OPS_DOKPLOY_SERVICES_DEPLOY_WEBHOOK }}
        GH_WEBSITE_WEBHOOK: ${{ vars.BONDERY_OPS_DOKPLOY_WEBSITE_DEPLOY_WEBHOOK }}
      run: |
        set -euo pipefail

        set_if_empty() {
          local name="$1"
          local fallback="$2"
          if [ -z "$fallback" ]; then
            return 0
          fi
          eval "current=\${${name}:-}"
          if [ -z "$current" ]; then
            echo "${name}=${fallback}" >> "$GITHUB_ENV"
          fi
        }

        case "$PROFILE" in
          extension)
            set_if_empty BONDERY_INFRA_CHROME_EXTENSION_ID "$GH_CHROME_EXTENSION_ID"
            set_if_empty BONDERY_OPS_CHROME_PUBLISHER_ID "$GH_CHROME_PUBLISHER_ID"
            set_if_empty BONDERY_PUBLIC_WEBAPP_URL "$GH_PUBLIC_WEBAPP_URL"
            set_if_empty BONDERY_PUBLIC_API_URL "$GH_PUBLIC_API_URL"
            set_if_empty BONDERY_PUBLIC_OAUTH_CLIENT_ID "$GH_PUBLIC_OAUTH_CLIENT_ID"
            ;;
          services-webhook)
            set_if_empty BONDERY_OPS_DOKPLOY_SERVICES_DEPLOY_WEBHOOK "$GH_SERVICES_WEBHOOK"
            ;;
          website-webhook)
            set_if_empty BONDERY_OPS_DOKPLOY_WEBSITE_DEPLOY_WEBHOOK "$GH_WEBSITE_WEBHOOK"
            ;;
          *)
            echo "Unknown profile: $PROFILE" >&2
            exit 1
            ;;
        esac

name: Dokploy save compose env
description: Sync Infisical dokploySync keys to Dokploy compose environment (expects Infisical env loaded).

inputs:
  dry_run:
    description: Dry run: Log env names to runner console instead of uploading to Dokploy API
    required: false
    default: "true"
  redeploy:
    description: Trigger redeploy webhook
    required: false
    default: "false"
  target:
    description: Sync target (website, services, services-beta, or plausible Dokploy compose app)
    required: false
    default: website

runs:
  using: composite
  steps:
    - name: Sync Infisical env to Dokploy
      shell: bash
      env:
        DRY_RUN: ${{ inputs.dry_run }}
        REDEPLOY: ${{ inputs.redeploy }}
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        args=(--target "$TARGET")
        if [ "$DRY_RUN" = "true" ]; then
          args+=(--dry-run)
        fi
        if [ "$REDEPLOY" = "true" ]; then
          args+=(--redeploy)
        fi
        node scripts/sync-infisical-to-dokploy.mjs "${args[@]}"

name: Docker verify build
description: >-
  Build a production Docker image without pushing (PR verify).
  Caller must checkout the repo and gate with paths-filter before invoking.

inputs:
  dockerfile:
    description: Dockerfile path relative to repository root
    required: true
  dockerignore_file:
    description: Service-specific dockerignore file
    required: true
  image_name:
    description: Fully qualified image name (used for local tag only)
    required: true
  git_sha:
    description: Git revision baked into OCI labels
    required: true
  build_args:
    description: Multiline Docker build args (BUILD_DATE is appended automatically)
    required: false
    default: ""
  turbo_token:
    description: Turborepo remote cache token
    required: false
    default: ""
  turbo_team:
    description: Turborepo team slug
    required: false
    default: ""
  cache_scope:
    description: BuildKit GHA cache scope (unique per parallel job)
    required: false
    default: buildkit

runs:
  using: composite
  steps:
    - name: Resolve build timestamp
      id: build_time
      shell: bash
      run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

    - name: Prepare Docker ignore file
      uses: ./.github/actions/shared/prepare-dockerignore
      with:
        dockerignore_file: ${{ inputs.dockerignore_file }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build (verify only)
      uses: docker/build-push-action@v7
      env:
        BUILDKIT_PROGRESS: plain
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: false
        tags: ${{ format('{0}:verify', inputs.image_name) }}
        build-args: |
          ${{ inputs.build_args }}
          BUILD_DATE=${{ steps.build_time.outputs.created }}
          TURBO_TEAM=${{ inputs.turbo_team }}
        secrets: |
          turbo_token=${{ inputs.turbo_token }}
        cache-from: type=gha,scope=${{ inputs.cache_scope }}
        cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope }}
        provenance: false
        sbom: false

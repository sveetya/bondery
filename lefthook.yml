pre-commit:
  parallel: false
  commands:
    env-sync:
      glob:
        - "package.json"
        - "packages/helpers/src/env/manifest.ts"
        - "scripts/env/**"
        - "scripts/pkg/sync-version.mjs"
        - "scripts/check/check-versions.mjs"
      run: pnpm run env:sync -- --stage
    openapi:
      glob:
        - "apps/api/src/**/*.ts"
        - "packages/schemas/src/**/*.ts"
      run: pnpm --filter api run generate:openapi
    biome:
      glob: "*"
      run: node scripts/check/run-pre-commit-biome.mjs

# Local dev Postgres only — no Traefik, no dokploy-network.
#
#   npm run start:postgres
#
# Host port 54322. Stop any other Postgres on that port before starting.

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    ports:
      - "54322:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${BONDERY_PRIVATE_POSTGRES_PASSWORD:?BONDERY_PRIVATE_POSTGRES_PASSWORD must be set}
      POSTGRES_DB: bondery
    volumes:
      - bondery-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bondery"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bondery-postgres-data:

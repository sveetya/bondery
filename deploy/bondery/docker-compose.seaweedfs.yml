# Bundled SeaweedFS object storage (S3-compatible gateway).
# Included by docker-compose.yml. API uses BONDERY_PRIVATE_S3_ENDPOINT
# http://${BONDERY_INFRA_TRAEFIK_PREFIX}-storage:8333 (unique on dokploy-network).
# Cluster peer names (master -ip=, volume -mserver=, filer -master=) stay
# seaweedfs-master / seaweedfs-filer — those services are on per-stack `internal` only.

services:
  seaweedfs-master:
    command: "master -ip=seaweedfs-master -mdir=/data -defaultReplication=000"
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 10s
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9333/cluster/status"]
      timeout: 5s
    image: chrislusf/seaweedfs:4.40
    networks:
      internal:
        aliases:
          - ${BONDERY_INFRA_TRAEFIK_PREFIX:-bondery}-seaweedfs-master
    restart: unless-stopped
    volumes:
      - seaweedfs-master-data:/data

  seaweedfs-volume:
    command: "volume -mserver=seaweedfs-master:9333 -dir=/data -max=100"
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 10s
      test: ["CMD", "wget", "-q", "-O", "-", "http://seaweedfs-volume:8080/healthz"]
      timeout: 5s
    image: chrislusf/seaweedfs:4.40
    networks:
      internal:
        aliases:
          - ${BONDERY_INFRA_TRAEFIK_PREFIX:-bondery}-seaweedfs-volume
    restart: unless-stopped
    volumes:
      - seaweedfs-volume-data:/data

  seaweedfs-filer:
    command: "filer -master=seaweedfs-master:9333 -ip=seaweedfs-filer"
    depends_on:
      seaweedfs-master:
        condition: service_healthy
      seaweedfs-volume:
        condition: service_healthy
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 10s
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8888/"]
      timeout: 5s
    image: chrislusf/seaweedfs:4.40
    networks:
      internal:
        aliases:
          - ${BONDERY_INFRA_TRAEFIK_PREFIX:-bondery}-seaweedfs-filer
    restart: unless-stopped
    volumes:
      - seaweedfs-filer-data:/data

  seaweedfs-s3:
    depends_on:
      seaweedfs-filer:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/etc/seaweedfs/entrypoint.sh"]
    environment:
      BONDERY_PRIVATE_S3_ACCESS_KEY_ID: ${BONDERY_PRIVATE_S3_ACCESS_KEY_ID:?BONDERY_PRIVATE_S3_ACCESS_KEY_ID must be set}
      BONDERY_PRIVATE_S3_SECRET_ACCESS_KEY: ${BONDERY_PRIVATE_S3_SECRET_ACCESS_KEY:?BONDERY_PRIVATE_S3_SECRET_ACCESS_KEY must be set}
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 15s
      test: ["CMD", "/bin/sh", "/etc/seaweedfs/s3-ready.sh"]
      timeout: 5s
    image: chrislusf/seaweedfs:4.40
    labels:
      - traefik.enable=true
      - "traefik.http.routers.${BONDERY_INFRA_TRAEFIK_PREFIX:-bondery}-storage.rule=Host(`${BONDERY_INFRA_STORAGE_DOMAIN:-storage.localhost}`)"
      - "traefik.http.routers.${BONDERY_INFRA_TRAEFIK_PREFIX:-bondery}-storage.entrypoints=websecure"
      - "traefik.http.routers.${BONDERY_INFRA_TRAEFIK_PREFIX:-bondery}-storage.tls.certResolver=letsencrypt"
      - "traefik.http.routers.${BONDERY_INFRA_TRAEFIK_PREFIX:-bondery}-storage.service=${BONDERY_INFRA_TRAEFIK_PREFIX:-bondery}-storage"
      - "traefik.http.services.${BONDERY_INFRA_TRAEFIK_PREFIX:-bondery}-storage.loadbalancer.server.port=8333"
    networks:
      dokploy-network:
        aliases:
          - ${BONDERY_INFRA_TRAEFIK_PREFIX:-bondery}-storage
      internal:
        aliases:
          - ${BONDERY_INFRA_TRAEFIK_PREFIX:-bondery}-storage
    restart: unless-stopped
    volumes:
      - ./seaweedfs/entrypoint.sh:/etc/seaweedfs/entrypoint.sh:ro
      - ./seaweedfs/s3-ready.sh:/etc/seaweedfs/s3-ready.sh:ro

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  seaweedfs-filer-data:
  seaweedfs-master-data:
  seaweedfs-volume-data:
